<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Lions — Player Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="resized_h_lions-removebg-preview.png">
<style>
  :root{
    --cream: #f7f3ea;
    --cream-dim: #efe9db;
    --ink: #17181c;
    --ink-soft: #2b2c31;
    --navy: #1b2a4a;
    --navy-deep: #101a30;
    --gold: #a9822f;
    --gold-soft: #c79f4f;
    --line: rgba(23,24,28,0.14);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background: var(--cream); color: var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{
    font-family:'Jost', sans-serif; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color: var(--gold); font-weight:600;
  }
  h1,h2,h3,.serif{ font-family:'Playfair Display', Georgia, serif; margin:0; }

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 40px; border-bottom:1px solid var(--line);
    background: var(--cream); position:sticky; top:0; z-index:20;
  }
  .back-link{
    font-family:'Jost', sans-serif; font-size:12.5px; letter-spacing:0.08em;
    text-transform:uppercase; font-weight:600; color: var(--ink-soft);
    text-decoration:none; display:flex; align-items:center; gap:8px;
  }
  .back-link:hover{ color: var(--ink); }
  .topbar-title{ display:flex; align-items:center; gap:12px; }
  .topbar-title .crest{
    width:34px; height:34px; border-radius:50%; background: var(--navy);
    border:1px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif; font-weight:700; font-size:12px; color: var(--gold-soft);
  }
  .topbar-title .t{ font-family:'Playfair Display', serif; font-weight:700; font-size:16.5px; }
  .counter{
    font-family:'Jost', sans-serif; font-size:11.5px; letter-spacing:0.1em;
    text-transform:uppercase; color:#8b8b8b;
  }

  .page-wrap{ max-width: 1080px; margin: 0 auto; padding: 48px 40px 90px; }

  .roster-strip{
    display:flex; gap:10px; overflow-x:auto; padding-bottom: 8px; margin-bottom: 40px;
  }
  .roster-chip{
    flex-shrink:0; display:flex; align-items:center; gap:9px;
    padding: 9px 16px; border:1px solid var(--line); background:#fdfcf8;
    cursor:pointer; transition: all .2s ease;
  }
  .roster-chip:hover{ border-color: var(--ink); }
  .roster-chip.active{ background: var(--ink); border-color: var(--ink); }
  .roster-chip.active .rc-num, .roster-chip.active .rc-name{ color: var(--cream); }
  .roster-chip .rc-num{ font-family:'Playfair Display', serif; font-weight:700; font-size:13px; color: var(--gold); }
  .roster-chip .rc-name{
    font-family:'Jost', sans-serif; font-size:11.5px; letter-spacing:0.03em; color: var(--ink-soft);
    white-space:nowrap;
  }

  /* Card */
  .player-card{ border: 1px solid var(--line); background:#fdfcf8; }
  .card-top{
    display:grid; grid-template-columns: 240px 1fr; gap:0;
    border-bottom: 1px solid var(--line);
  }
  .portrait-col{
    padding: 30px; border-right: 1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .portrait{
    position:relative; width:170px; height:190px;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    border: 2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
  }
  .portrait .initials{ font-family:'Playfair Display', serif; font-weight:800; font-size:46px; color: rgba(247,243,234,0.92); }
  .rating-badge{ position:absolute; top:10px; left:10px; display:flex; flex-direction:column; align-items:center; line-height:1; }
  .rating-badge .rn{ font-family:'Playfair Display', serif; font-weight:800; font-size:22px; color:#fbf8f1; }
  .rating-badge .rp{ font-family:'Jost', sans-serif; font-size:10px; letter-spacing:0.08em; color: var(--gold-soft); margin-top:2px; text-transform:uppercase; }
  .portrait-meta{ width:100%; }
  .pm-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 8px 0; border-bottom:1px solid var(--line);
    font-family:'Jost', sans-serif; font-size:11.5px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-soft);
  }
  .pm-row:last-child{ border-bottom:none; }
  .stars{ color: var(--gold); letter-spacing:1px; font-size:12px; }

  .info-col{ padding: 30px 34px; }
  .name-block .first{ font-family:'Jost', sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8b8b8b; }
  .name-block .last{ font-family:'Playfair Display', serif; font-weight:800; font-size:32px; margin-top:2px; }
  .meta-line{
    display:flex; flex-wrap:wrap; gap: 18px; margin-top: 14px; margin-bottom: 26px;
    font-family:'Jost', sans-serif; font-size:12px; letter-spacing:0.04em; color:#8b8b8b;
  }
  .meta-line span b{ color: var(--ink); font-weight:600; }

  /* Summary view */
  .ovr-block{
    display:flex; align-items:center; gap:16px; margin-bottom: 26px;
    padding-bottom: 22px; border-bottom: 1px solid var(--line);
  }
  .ovr-num{ font-family:'Playfair Display', serif; font-weight:800; font-size:44px; color: var(--navy); }
  .ovr-label{ font-family:'Jost', sans-serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#8b8b8b; }
  .summary-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px 30px; }
  .summary-stat{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px; border:1px solid var(--line); background: var(--cream);
  }
  .summary-stat .label{ font-family:'Jost', sans-serif; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color: var(--ink-soft); }
  .summary-stat .val{ font-family:'Playfair Display', serif; font-weight:800; font-size:22px; }

  /* Traits view */
  .traits-intro{
    font-family:'Jost', sans-serif; font-size:11.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:#8b8b8b; margin-bottom:18px;
  }
  .traits-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .trait-chip{
    display:flex; align-items:flex-start; gap:12px;
    padding: 14px 16px; border:1px solid var(--line); background: var(--cream);
  }
  .trait-chip .tmark{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background: var(--navy); border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif; font-weight:700; font-size:13px; color: var(--gold-soft);
  }
  .trait-chip .tname{ font-family:'Playfair Display', serif; font-weight:700; font-size:15px; }
  .trait-chip .tdesc{ font-family:'Source Serif 4', serif; font-size:13px; color: var(--ink-soft); margin-top:3px; line-height:1.4; }

  /* Transfer view (placeholder) */
  .transfer-block{
    padding: 40px 10px; text-align:center;
    border: 1px dashed var(--line);
  }
  .transfer-block .tt{ font-family:'Playfair Display', serif; font-weight:700; font-size:20px; margin-bottom:8px; }
  .transfer-block .td{ font-family:'Source Serif 4', serif; font-size:14px; color:#8b8b8b; }

  .tabbar{ display:flex; border-top: 1px solid var(--line); }
  .tabbar .tab{
    flex:1; text-align:center; padding: 15px 10px; background:none; border:none;
    font-family:'Jost', sans-serif; font-size:11.5px; letter-spacing:0.1em;
    text-transform:uppercase; font-weight:600; color:#9a9a9a;
    border-bottom: 2px solid transparent; cursor:pointer; transition: color .2s ease;
  }
  .tabbar .tab:hover{ color: var(--ink-soft); }
  .tabbar .tab.active{ color: var(--ink); border-bottom-color: var(--gold); }

  .tab-content{ padding: 30px 34px 34px; }

  .nav-row{ display:flex; align-items:center; justify-content:space-between; margin-top: 26px; }
  .nav-btn{
    font-family:'Jost', sans-serif; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase; font-weight:600; padding: 13px 22px;
    background: var(--ink); color: var(--cream); border:none; cursor:pointer;
    transition: background .2s ease;
  }
  .nav-btn:hover{ background:#000; }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }

  @media (max-width: 720px){
    .topbar{ padding: 16px 20px; }
    .page-wrap{ padding: 32px 20px 60px; }
    .card-top{ grid-template-columns: 1fr; }
    .portrait-col{ border-right:none; border-bottom:1px solid var(--line); }
    .summary-grid{ grid-template-columns: repeat(2, 1fr); }
    .traits-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>

  function summaryTabHTML(p){
    const entries = Object.entries(p.categories).map(([label, cdata]) => [label, cdata.total]);
    return `
      <div class="ovr-block">

      <div class="summary-grid">

          <div class="summary-stat">
            <span class="label">${label}</span>
            <span class="val">${val}</span>
          </div>
        `).join('')}

    `;

            <div class="tmark">✦</div>
            <div>
              <div class="tname">${t.name}</div>
            </div>
          </div>

      </div>
    `;
  }

        <div class="tt">Not Transfer Listed</div>
        <div class="td">${p.first} ${p.last} is contracted to Heritage Lions for the remainder of Season One.</div>
      </div>
    `;
  }

  function tabContentHTML(p, tab){
    if(tab === 'traits') return traitsTabHTML(p);
    if(tab === 'transfer') return transferTabHTML(p);
    return summaryTabHTML(p);
  }

  function tabbarHTML(tab){
    const tabs = [
      { key: 'summary', label: 'Summary' },
      { key: 'traits', label: 'Traits' },
      { key: 'transfer', label: 'Transfer' }
    ];
    return `
      <div class="tabbar">
        ${tabs.map(t => `
          <button class="tab ${tab === t.key ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>
        `).join('')}
      </div>
    `;
  }

    `;

    document.getElementById('tab-content').innerHTML = tabContentHTML(p, currentTab);

    document.querySelectorAll('.tabbar .tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        renderCard();
      });
    });

    document.getElementById('counter').textContent = `${currentIndex + 1} / ${lions.length}`;
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === lions.length - 1;

    document.querySelectorAll('.roster-chip').forEach((chip, i) => {
      chip.classList.toggle('active', i === currentIndex);
    });
  }

  function renderRosterStrip(){
    const strip = document.getElementById('roster-strip');
    strip.innerHTML = lions.map((p, i) => `
      <div class="roster-chip" data-index="${i}">
        <span class="rc-num">${p.number}</span>
        <span class="rc-name">${p.last}</span>
      </div>
    `).join('');

    strip.querySelectorAll('.roster-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        currentIndex = parseInt(chip.dataset.index, 10);
        currentTab = 'summary';
        renderCard();
      });
    });
  }

  document.getElementById('prev-btn').addEventListener('click', () => {
    if(currentIndex > 0){ currentIndex--; currentTab = 'summary'; renderCard(); }
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    if(currentIndex < lions.length - 1){ currentIndex++; currentTab = 'summary'; renderCard(); }
  });

  renderRosterStrip();
  renderCard();
</script>

</body>
</html>
